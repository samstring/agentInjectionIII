name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test


  simulator-smoke:
    needs: swift
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode and CocoaPods environment
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          pod --version || true

      - name: Run mixed ObjC Swift CocoaPods injection smoke
        shell: bash
        run: bash scripts/test-simulator-smoke.sh

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-smoke
          path: |
            ${{ runner.temp }}/agentInjectionIII-smoke
          if-no-files-found: ignore
