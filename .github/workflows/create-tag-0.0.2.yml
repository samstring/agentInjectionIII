name: Create tag 0.0.2

on:
  push:
    branches:
      - feature/objc-swift-hot-reload
    paths:
      - .github/workflows/create-tag-0.0.2.yml

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create 0.0.2 tag on merged main commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          if git rev-parse -q --verify refs/tags/0.0.2 >/dev/null; then
            echo "Tag 0.0.2 already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a 0.0.2 751282aa4963a9b34f4b6c85a9ced52af74593e9 -m "0.0.2"
          git push origin refs/tags/0.0.2
